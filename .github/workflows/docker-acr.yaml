name: Docker Build and Push to Azure ACR

on:
  push:
    branches:
      - batch/july26

env:
  ACR_REGISTRY: nextkodeschool.azurecr.io
  IMAGE_NAME: nks-frontend

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Login to Azure Container Registry
      - name: Login to Azure ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Step 3: Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .

      # Step 4: Push Docker image to ACR
      - name: Push Docker Image
        run: |
          docker push \
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest